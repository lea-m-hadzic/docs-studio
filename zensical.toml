# Documentation site for docs-studio.
#
# Generated by docs-studio 0.1.0 — a MANAGED file. It is derived entirely from
# docs-studio.toml; change that file and run `docs-studio update`. Edits here are
# reported as a conflict and are not overwritten.
#
# Build: pip install "zensical==0.0.67" && zensical build --strict
[project]
site_name = "docs-studio"
site_description = "Generate polished Zensical documentation sites from one config file"
site_author = "Lea M. Hadzic"
site_url = "https://lea-m-hadzic.github.io/docs-studio/"
edit_uri = ""
copyright = "Apache-2.0. Derived material and its notices are recorded in NOTICE."
docs_dir = "docs"
site_dir = "site"
# The second stylesheet is yours; it loads after the generated one.
extra_css = ["stylesheets/extra.css", "stylesheets/custom.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "install.md" },
    { "Quickstart" = "quickstart.md" },
  ] },
  { "Commands" = [
    { "init" = "init.md" },
    { "check" = "check.md" },
    { "update" = "update.md" },
    { "presets" = "presets.md" },
  ] },
  { "Configuration" = [
    { "docs-studio.toml" = "configuration.md" },
    { "Palettes" = "palettes.md" },
    { "Logo and favicon" = "branding.md" },
  ] },
  { "How it works" = [
    { "File ownership" = "ownership.md" },
    { "Safe updates" = "updating.md" },
    { "Validation" = "validation.md" },
    { "Architecture" = "architecture.md" },
    { "Where the design came from" = "comparative-analysis.md" },
    { "Attribution" = "attribution.md" },
  ] },
  { "Deploying" = "deployment.md" },
  { "Examples" = "examples.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
logo = "assets/docs-studio-mark.svg"
favicon = "assets/docs-studio-favicon.svg"
font = false                      # system fonts: no third-party font requests
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }  # theme icons, e.g. :simple-github:
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
