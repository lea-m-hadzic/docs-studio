# Documentation site for Greenline.
#
# Generated by docs-studio 0.1.0 — a MANAGED file. It is derived entirely from
# docs-studio.toml; change that file and run `docs-studio update`. Edits here are
# reported as a conflict and are not overwritten.
#
# Build: pip install "zensical==0.0.67" && zensical build --strict
[project]
site_name = "Greenline"
site_description = "A route planner for the city's protected bike lanes"
site_author = "Greenline Volunteers"
site_url = "https://example.github.io/greenline/"
edit_uri = ""
docs_dir = "docs"
site_dir = "site"
# The second stylesheet is yours; it loads after the generated one.
extra_css = ["stylesheets/extra.css", "stylesheets/custom.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Quickstart" = "quickstart.md" },
    { "Install" = "install.md" },
  ] },
  { "Using it" = [
    { "Planning a route" = "usage.md" },
    { "Reporting a blockage" = "blockages.md" },
  ] },
  { "Contributing" = [
    { "Adding a lane" = "adding-a-lane.md" },
    { "House style" = "house-style.md" },
  ] },
  { "Questions" = "faq.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
font = false                      # system fonts: no third-party font requests
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue grey"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue grey"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }  # theme icons, e.g. :simple-github:
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
