# Documentation site for tidepool.
#
# Generated by docs-studio 0.1.0 — a MANAGED file. It is derived entirely from
# docs-studio.toml; change that file and run `docs-studio update`. Edits here are
# reported as a conflict and are not overwritten.
#
# Build: pip install "zensical==0.0.67" && zensical build --strict
[project]
site_name = "tidepool"
site_description = "Reproducible sampling and aggregation for long-running measurement runs"
site_author = "Example Lab"
site_url = "https://example.github.io/tidepool/"
edit_uri = ""
docs_dir = "docs"
site_dir = "site"
# The second stylesheet is yours; it loads after the generated one.
extra_css = ["stylesheets/extra.css", "stylesheets/custom.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Quickstart" = "quickstart.md" },
    { "Install" = "install.md" },
  ] },
  { "Guide" = [
    { "Running a measurement" = "usage.md" },
    { "Sampling and aggregation" = "aggregation.md" },
  ] },
  { "Reference" = [
    { "Python API" = "api.md" },
    { "Result schemas" = "schemas.md" },
  ] },
  { "Citation" = "citation.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
font = false                      # system fonts: no third-party font requests
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }  # theme icons, e.g. :simple-github:
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
