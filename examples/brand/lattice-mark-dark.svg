<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Lattice.jl">
  <title>Lattice.jl</title>
  <!-- A lattice: three rows of nodes on a rotated square grid, the edges fading toward
       the top right, with one node picked out in coral. Dark-header variant: every tone lifted one step. -->
  <g stroke="#A79AE4" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M 14 70 L 48 36 L 82 70" opacity="0.95"/>
    <path d="M 14 70 L 48 70 L 82 70" opacity="0.5"/>
    <path d="M 31 53 L 65 53" opacity="0.7"/>
    <path d="M 31 53 L 31 70" opacity="0.45"/>
    <path d="M 65 53 L 65 70" opacity="0.45"/>
  </g>
  <g fill="#8E82D9">
    <circle cx="14" cy="70" r="6"/>
    <circle cx="48" cy="70" r="6"/>
    <circle cx="82" cy="70" r="6"/>
  </g>
  <g fill="#C3B9F0">
    <circle cx="31" cy="53" r="5.4"/>
    <circle cx="65" cy="53" r="5.4"/>
  </g>
  <circle cx="48" cy="36" r="7" fill="#F0787F"/>
</svg>
