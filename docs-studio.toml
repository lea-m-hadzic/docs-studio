# docs-studio.toml — the single source of truth for this documentation site.
#
# `docs-studio update` regenerates the styling and zensical.toml from this file.
# Pages under docs/ and artwork under docs/assets/ are yours and are never
# rewritten. Run `docs-studio check` after any change here.

# The toolkit version that last generated this site.
docs_studio_version = "0.1.0"

[project]
name = "docs-studio"
description = "Generate polished Zensical documentation sites from one config file"
author = "Lea M. Hadzic"
# The published URL. Under GitHub Pages this includes the repository path, and
# it is what makes assets resolve on a project site.
site_url = "https://lea-m-hadzic.github.io/docs-studio/"
repo_url = "https://github.com/lea-m-hadzic/docs-studio"
copyright = "Apache-2.0. Derived material and its notices are recorded in NOTICE."
# python | julia | generic — picks the starter wording and the extra checks
language = "python"

[theme]
# Run `docs-studio presets` to see them. Add a [theme.light] / [theme.dark]
# table to override individual tokens, or set palette_file for a full palette.
# A palette of its own, supplied as a file rather than a bundled preset.
preset = "neutral"
palette_file = "docs-studio-palette.toml"

[branding]
# Paths relative to this file. An SVG or PNG is copied verbatim — never resized,
# re-encoded or cropped — and is never overwritten by an update. With no logo,
# a monogram is generated from the project's initials and the palette.
logo = "brand/docs-studio-mark.svg"
# logo_dark = "docs/assets/my-logo-dark.svg"   # optional dark-header variant
# wordmark = "docs/assets/my-wordmark.svg"     # optional, shown above the home headline
favicon = "brand/docs-studio-favicon.svg"

logo_dark = "brand/docs-studio-mark-dark.svg"

# Compact outlined buttons in the home-page resource row. `icon` is a theme icon
# shortcode (simple-github, material/file-document-outline, …); use `image` with a
# path under docs/ for a brand mark the theme does not ship.

[[resources]]
label = "GitHub Repository"
url = "https://github.com/lea-m-hadzic/docs-studio"
icon = "simple-github"

[[resources]]
label = "Zensical"
url = "https://zensical.org"
icon = "material/web"

# The navigation. Every page listed here gets a starter page generated once.
# `pages` entries may be a filename, or { title = "…", page = "…" } to set the
# label explicitly.

[[nav]]
title = "Home"
page = "index.md"

[[nav]]
title = "Getting started"
pages = [
  { title = "Installation", page = "install.md" },
  { title = "Quickstart", page = "quickstart.md" },
]

[[nav]]
title = "Commands"
pages = [
  { title = "init", page = "init.md" },
  { title = "check", page = "check.md" },
  { title = "update", page = "update.md" },
  { title = "presets", page = "presets.md" },
]

[[nav]]
title = "Configuration"
pages = [
  { title = "docs-studio.toml", page = "configuration.md" },
  { title = "Palettes", page = "palettes.md" },
  { title = "Logo and favicon", page = "branding.md" },
]

[[nav]]
title = "How it works"
pages = [
  { title = "File ownership", page = "ownership.md" },
  { title = "Safe updates", page = "updating.md" },
  { title = "Validation", page = "validation.md" },
  { title = "Architecture", page = "architecture.md" },
  { title = "Where the design came from", page = "comparative-analysis.md" },
  { title = "Attribution", page = "attribution.md" },
]

[[nav]]
title = "Deploying"
page = "deployment.md"

[[nav]]
title = "Examples"
page = "examples.md"

[[nav]]
title = "Contributing"
page = "contributing.md"

[deploy]
github_pages = true
# manual: publish only when someone runs the workflow. push: publish on every
# push to `branch`. Either way the build is strict, so a broken link fails first.
trigger = "manual"
branch = "main"
python_version = "3.13"
# Pinned so a published build is reproducible.
zensical_version = "0.0.67"
# This repository IS docs-studio, so the Pages job installs it from the
# checkout rather than from PyPI.
extra_install = ["pip install ."]
