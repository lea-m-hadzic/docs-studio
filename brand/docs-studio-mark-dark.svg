<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="docs-studio">
  <title>docs-studio</title>
  <!-- Dark-header variant: the deep teal front sheet goes murky on black, so every
       tone is lifted one step and the bars invert to the dark background colour. -->
  <rect x="30" y="8" width="52" height="64" rx="8" fill="#3E8F89" transform="rotate(6 56 40)"/>
  <rect x="12" y="20" width="56" height="68" rx="9" fill="#5FC9C0"/>
  <g fill="#0E1716">
    <rect x="23" y="38" width="34" height="5.5" rx="2.75" opacity="0.85"/>
    <rect x="23" y="52" width="24" height="5.5" rx="2.75" opacity="0.55"/>
    <rect x="23" y="66" width="29" height="5.5" rx="2.75" opacity="0.32"/>
  </g>
  <circle cx="79" cy="77" r="9" fill="#E8A75C"/>
</svg>
