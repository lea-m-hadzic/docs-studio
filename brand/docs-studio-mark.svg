<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="docs-studio">
  <title>docs-studio</title>
  <!-- Two offset sheets — the generated one behind, the one you write in front — with
       the accent dot the design system reserves for a single small highlight. Drawn
       for this project; see docs/branding.md for how a project supplies its own. -->
