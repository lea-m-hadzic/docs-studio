  <rect x="12" y="20" width="56" height="68" rx="9" fill="#0F6E6B"/>
  <g fill="#FFFFFF">
    <rect x="23" y="38" width="34" height="5.5" rx="2.75" opacity="0.92"/>
    <rect x="23" y="52" width="24" height="5.5" rx="2.75" opacity="0.62"/>
    <rect x="23" y="66" width="29" height="5.5" rx="2.75" opacity="0.38"/>
  </g>
  <circle cx="79" cy="77" r="9" fill="#D97A2B"/>
</svg>
